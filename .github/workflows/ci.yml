name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem 'version' aqui: usa o campo packageManager do package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  # Testes de política (RLS) e de segurança por perfil, em pgTAP, contra um
  # Supabase local efêmero (migrations + seed aplicados). Roda em paralelo.
  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Versão fixada para CI determinístico (igual à validada localmente).
          version: 2.122.0

      - name: Subir Supabase local (db + migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,vector,logflare

      - name: Testes de RLS/segurança (pgTAP)
        run: supabase test db
