# Config mínima do Supabase. Rode `supabase init` para regenerar completa,
# e `supabase link --project-ref <ref>` para apontar dev/homologação.
project_id = "obdc"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enable_signup = true

[auth.email]
enable_signup = true
# Login por e-mail e senha (decisão M0); confirmação por e-mail desligada no dev.
enable_confirmations = false
