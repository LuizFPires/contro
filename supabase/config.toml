# Config mínima do Supabase. Rode `supabase init` para regenerar completa,
# e `supabase link --project-ref <ref>` para apontar dev/homologação.
project_id = "contro"

# Portas próprias (as padrão 5432x já são usadas por outros stacks locais).
[api]
port = 54821

[studio]
port = 54823

[inbucket]
port = 54824

# Analytics (logflare) desligado no dev local para aliviar a máquina.
[analytics]
enabled = false

[db]
major_version = 15
port = 54822
shadow_port = 54820

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/modelos.sql", "./seeds/pre_obra.sql"]

[auth]
enable_signup = true

[auth.email]
enable_signup = true
# Login por e-mail e senha (decisão M0); confirmação desligada só no dev.
# Em produção/homologação: usar convite ou confirmação. A RLS já exige que o
# usuário seja um membro (pessoa ativa) para ler/escrever, então um cadastro
# avulso no Auth não acessa dado algum até ser promovido a pessoa.
enable_confirmations = false
